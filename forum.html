<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums de Discussion</title>
    <link rel="stylesheet" href="forum.css">
    <script type="module" src="forum.js?v=persisted-forum-20261008"></script>
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="elegant-theme-v2.css">
</head>
<body>
    <header>
        <h1>Forums de Discussion</h1>
    </header>
    <main>
        <div id="categories-container">
            <button class="category-button" data-category="design">Design et Création</button>
            <button class="category-button" data-category="tech">Innovation Technologique</button>
            <button class="category-button" data-category="community">Projets Communautaires</button>
        </div>    
        <div id="chat-container">
            <p id="forum-status" role="status" aria-live="polite">Chargement des échanges…</p>
            <ul id="messages"></ul>
            <form id="forum-form">
              <label for="message-input">Votre message</label>
              <textarea id="message-input" maxlength="1000" rows="3" placeholder="Tapez votre message ici…" required></textarea>
              <button id="send-button" type="submit">Envoyer</button>
            </form>
            <a href="connexion.html" id="forum-login-link">Connectez-vous pour participer</a>
        </div>
    </main>
    <a href="index.html" class="back-button">Retour à l'accueil</a>
</body>
