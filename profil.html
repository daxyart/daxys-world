<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Profil public d’un membre de Daxy’s World."><title>Profil — Daxy's World</title>
<link rel="stylesheet" href="messagerie.css/messagerie.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="elegant-theme-v2.css">
<style>
.profile-card{max-width:760px;margin:2rem auto;padding:clamp(1.25rem,4vw,2.5rem);background:#fffdf9;border:1px solid #eadfce;border-radius:24px;box-shadow:0 18px 55px #17233414}.profile-head{text-align:center}.profile-avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#eee6d9;border:4px solid #fff;box-shadow:0 4px 22px #17233422}.profile-initial{display:grid;place-items:center;margin:0 auto;width:132px;height:132px;border-radius:50%;background:#d2b67b;color:#172334;font-size:3rem;font-weight:700}.profile-head h1{margin:.8rem 0 .25rem}.profile-bio{max-width:560px;margin:.5rem auto;color:#586274;white-space:pre-wrap}.profile-stats{display:flex;justify-content:center;gap:1.5rem;margin:1.25rem 0}.profile-stats span{display:grid;gap:.15rem;text-align:center;color:#687386}.profile-stats strong{color:#172334;font-size:1.2rem}.profile-actions{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin:1.5rem 0}.profile-actions .button,.profile-actions button{min-height:44px;padding:.75rem 1.2rem;border:0;border-radius:12px;background:#172334;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.profile-actions .secondary{background:#eee6d9;color:#172334}.profile-actions button:disabled{opacity:.6;cursor:wait}.profile-posts{margin-top:2rem;border-top:1px solid #eee6d9;padding-top:1.5rem}.profile-post{padding:1rem 0;border-bottom:1px solid #eee6d9;white-space:pre-wrap;overflow-wrap:anywhere}.profile-post img{display:block;max-width:100%;max-height:560px;object-fit:contain;border-radius:14px;margin-top:.8rem}.profile-post time{display:block;color:#7b8492;font-size:.85rem;margin-bottom:.5rem}.profile-status{padding:1rem;border-radius:12px;background:#f5f0e7;color:#26354b}.profile-status.error{color:#a52d3a}.hidden{display:none!important}@media(max-width:600px){.profile-card{margin:1rem .5rem;border-radius:18px}.profile-avatar,.profile-initial{width:104px;height:104px}.profile-stats{gap:1rem}}
</style></head>
<body><header class="topbar"><a class="brand" href="index.html">Daxy's <span>World</span></a><nav><a href="index.html">Accueil</a><a href="messagerie.html">Messages</a></nav></header>
<main class="wrap"><p><a href="messagerie.html">← Retour à la recherche</a></p><div id="profile-status" class="profile-status" role="status" aria-live="polite">Chargement du profil…</div>
<article id="profile-card" class="profile-card hidden"><header class="profile-head"><div id="avatar-host"></div><p class="eyebrow">PROFIL PUBLIC</p><h1 id="profile-name"></h1><p id="profile-bio" class="profile-bio"></p><div class="profile-stats" aria-label="Réseau"><span><strong id="followers-count">0</strong> abonnés</span><span><strong id="following-count">0</strong> abonnements</span></div><div class="profile-actions"><a id="message-link" class="button" href="messagerie.html">Envoyer un message</a><button id="follow-button" class="secondary hidden" type="button">Suivre</button></div></header><section class="profile-posts"><h2>Publications publiques</h2><div id="profile-posts"></div></section></article></main><footer><a href="index.html">Daxy’s World</a></footer>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './auth-config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), $=id=>document.getElementById(id);
const userId=new URLSearchParams(location.search).get('id'), status=$('profile-status'), card=$('profile-card');
const fail=text=>{status.textContent=text;status.classList.add('error')};
if(!userId){fail('Aucun profil n’a été indiqué. Revenez à la recherche des membres.')}else{
 const [{data:profile,error}, {data:{session}}]=await Promise.all([sb.from('profiles').select('id,display_name,bio,avatar_url').eq('id',userId).maybeSingle(),sb.auth.getSession()]);
 if(error||!profile){fail('Ce profil est introuvable pour le moment.')}else{
  const name=profile.display_name||'Membre';document.title=name+' — Daxy’s World';$('profile-name').textContent=name;$('profile-bio').textContent=profile.bio||'Ce membre n’a pas encore ajouté de présentation.';
  if(profile.avatar_url){const img=document.createElement('img');img.className='profile-avatar';img.src=profile.avatar_url;img.alt='Photo de profil de '+name;$('avatar-host').append(img)}else{const initial=document.createElement('div');initial.className='profile-initial';initial.setAttribute('aria-label','Avatar de '+name);initial.textContent=name.trim().slice(0,1).toUpperCase();$('avatar-host').append(initial)}
  $('message-link').href='messagerie.html?to='+encodeURIComponent(profile.id);
  if(session?.user?.id===profile.id){$('message-link').textContent='Ouvrir mes messages'}else if(session?.user){const follow=$('follow-button');follow.classList.remove('hidden');const {data:existing}=await sb.from('follows').select('following_id').eq('follower_id',session.user.id).eq('following_id',profile.id).maybeSingle();let following=Boolean(existing);const updateButton=()=>{follow.textContent=following?'Abonné':'Suivre';follow.classList.toggle('is-following',following)};updateButton();follow.addEventListener('click',async()=>{follow.disabled=true;const result=following?await sb.from('follows').delete().eq('follower_id',session.user.id).eq('following_id',profile.id):await sb.from('follows').insert({follower_id:session.user.id,following_id:profile.id});follow.disabled=false;if(result.error){status.textContent='Impossible de mettre à jour cet abonnement. Réessayez.';status.classList.add('error');status.classList.remove('hidden')}else{following=!following;updateButton()}})}
  const [followers,following]=await Promise.all([sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',profile.id),sb.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',profile.id)]);$('followers-count').textContent=String(followers.count??0);$('following-count').textContent=String(following.count??0);
  const {data:posts}=await sb.from('posts').select('id,body,image_url,created_at').eq('author_id',profile.id).eq('visibility','public').order('created_at',{ascending:false}).limit(30);const host=$('profile-posts');if(!posts?.length){host.textContent='Aucune publication publique pour le moment.'}else for(const post of posts){const article=document.createElement('article');article.className='profile-post';const time=document.createElement('time');time.dateTime=post.created_at;time.textContent=new Date(post.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});article.append(time);if(post.body){const text=document.createElement('p');text.textContent=post.body;article.append(text)}if(post.image_url){const image=document.createElement('img');image.src=post.image_url;image.alt='Image publiée par '+name;image.loading='lazy';article.append(image)}host.append(article)}
  status.classList.add('hidden');card.classList.remove('hidden')
 }
}
</script></body></html>
