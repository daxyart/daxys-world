<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Daxy's World</title>
  <link rel="stylesheet" href="inscription.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="elegant-theme-v2.css">
</head>
<body>
  <header class="hero">
    <h1>Bienvenue dans Daxy's World</h1>
    <p>Explorez un monde d'interactions et de créativité.</p>
  </header>
  <main>
    <section id="signup" class="signup-section">
      <h2>Inscrivez-vous 🌟</h2>
      <p>Rejoignez notre communauté.</p>
      <form id="signup-form">
        <label for="signup-email">Adresse e-mail</label>
        <input id="signup-email" name="email" type="email" autocomplete="email" required>
        <label for="signup-password">Mot de passe (au moins 8 caractères)</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="signup-password-confirm">Confirmer le mot de passe</label>
        <input id="signup-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit">Créer mon compte</button>
      </form>
      <p id="auth-message" role="status" aria-live="polite"></p>
      <p>Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
      <p><a href="index.html">Retour à l'accueil</a></p>
    </section>
  </main>
  <footer><p>&copy; 2025 Daxy's World - Tous droits réservés.</p></footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
