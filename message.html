<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact</title>
    <link rel="stylesheet" href="message.css">
    <script defer src="message.js"></script>
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="elegant-theme-v2.css">
</head>
<body>
    <header class="hero">
        <h1 id="introText">Bienvenue dans Daxy's World</h1>
        <p>Explorez un monde d'interactions et de créativité.</p>
    </header>
    <section id="contact">
        <h2>Contactez-nous</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="lastName">Nom :</label>
                <input type="text" id="lastName" name="lastName" placeholder="Votre nom" required>
            </div>
            <div class="form-group">
                <label for="firstName">Prénom :</label>
                <input type="text" id="firstName" name="firstName" placeholder="Votre prénom" required>
            </div>
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" placeholder="Votre email" required>
            </div>
            <div class="form-group">
                <label for="message">Message :</label>
                <textarea id="message" name="message" placeholder="Votre message" required></textarea>
            </div>
            <button type="submit">Envoyer</button>
        </form>
        <p>Le bouton ouvre votre application de messagerie pour que vous puissiez envoyer le message.</p>
    </section>
    <a href="index.html" class="back-button">Retour à l'accueil</a>
<footer>
     <p>&copy; 2025 Daxy's World - Tous droits réservés.</p>
</footer>
</body>
</html>
